<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#F8FAFC"/>
  <style>.title{font:700 38px sans-serif;fill:#172033}.sub{font:18px sans-serif;fill:#526079}.h{font:700 21px sans-serif;fill:#172033}.t{font:16px sans-serif;fill:#3F4B61}.code{font:16px monospace;fill:#1557A0}.box{fill:#FFF;stroke:#9CB7D9;stroke-width:2}.core{fill:#EEF5FC;stroke:#2D72B8;stroke-width:2}.guard{fill:#FFF7E8;stroke:#C58A24;stroke-width:2}.arrow{stroke:#506784;stroke-width:3;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#506784"/></marker></defs>
  <text x="70" y="70" class="title">通用多任务排序模型接口</text><text x="70" y="105" class="sub">输入是已有候选记录；输出仅为数值分数和组内名次</text>
  <rect x="70" y="180" width="310" height="180" rx="14" class="box"/><text x="95" y="220" class="h">ExistingRecordBatch</text><text x="95" y="258" class="code">heavy / vhh</text><text x="95" y="288" class="code">light (optional)</text><text x="95" y="318" class="code">antigen (optional)</text><text x="95" y="348" class="code">record_id / group_id</text>
  <rect x="70" y="470" width="310" height="180" rx="14" class="box"/><text x="95" y="510" class="h">TaskSpec</text><text x="95" y="548" class="code">name</text><text x="95" y="578" class="code">direction</text><text x="95" y="608" class="code">transform</text><text x="95" y="638" class="code">comparable_group</text>
  <rect x="500" y="250" width="300" height="300" rx="14" class="core"/><text x="530" y="295" class="h">RankingScorer</text><text x="530" y="345" class="code">encode(batch)</text><text x="530" y="395" class="code">score(features, task)</text><text x="530" y="445" class="code">rank(scores, groups)</text><text x="530" y="500" class="t">共享编码器 + 任务评分头</text><text x="530" y="530" class="t">训练/验证/推理同一 schema</text>
  <rect x="920" y="180" width="280" height="180" rx="14" class="box"/><text x="945" y="220" class="h">ScoreBatch</text><text x="945" y="262" class="code">record_id</text><text x="945" y="292" class="code">task_name</text><text x="945" y="322" class="code">score</text><text x="945" y="350" class="t">连续数值，可校准</text>
  <rect x="920" y="470" width="280" height="180" rx="14" class="box"/><text x="945" y="510" class="h">RankBatch</text><text x="945" y="552" class="code">record_id</text><text x="945" y="582" class="code">group_id</text><text x="945" y="612" class="code">rank</text><text x="945" y="640" class="t">组内排序，供验证/提交</text>
  <rect x="1280" y="250" width="250" height="300" rx="14" class="guard"/><text x="1305" y="295" class="h">不可变性守卫</text><text x="1305" y="340" class="t">✓ 只读字符串</text><text x="1305" y="380" class="t">✓ 版本化变换</text><text x="1305" y="420" class="t">✓ 分组可比性</text><text x="1305" y="475" class="t">× 无生成方法</text><text x="1305" y="515" class="t">× 无优化方法</text>
  <path d="M380 270 H490" class="arrow"/><path d="M380 560 H445 V470 H490" class="arrow"/><path d="M800 320 H910" class="arrow"/><path d="M800 480 H910" class="arrow"/><path d="M1200 400 H1270" class="arrow"/>
  <rect x="70" y="735" width="1460" height="80" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="100" y="783" class="t">评价层：真实标签 → 明确 rank 方法 → Spearman；模型选择只看无泄漏折外预测。来源：阶段0接口规划（未实现训练）。</text>
</svg>
